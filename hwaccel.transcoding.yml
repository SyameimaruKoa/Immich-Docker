# ハードウェアアクセラレーションによるトランスコーディング（動画変換）の設定
#
# Unraidなど、複数のComposeファイルをサポートしていないプラットフォームを使用している場合は、
# このファイル内の対象バックエンドのコンテンツを docker-compose.yml ファイルの immich-server サービスに
# コピーしてインライン化できます。
#
# 詳細についてはガイドを参照してください: https://docs.immich.app/features/hardware-transcoding

services:
  cpu: {}

  nvenc:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
                - compute
                - video

  quicksync:
    devices:
      - /dev/dri:/dev/dri

  rkmpp:
    security_opt: # privileged: true より安全に /sys および /proc への完全アクセスを許可します
      - systempaths=unconfined
      - apparmor=unconfined
    group_add:
      - video
    devices:
      - /dev/rga:/dev/rga
      - /dev/dri:/dev/dri
      - /dev/dma_heap:/dev/dma_heap
      - /dev/mpp_service:/dev/mpp_service
      #- /dev/mali0:/dev/mali0 # OpenCLによるHDR -> SDRトーンマッピングを有効化する場合のみ必要
    volumes:
      #- /etc/OpenCL:/etc/OpenCL:ro # OpenCLによるHDR -> SDRトーンマッピングを有効化する場合のみ必要
      #- /usr/lib/aarch64-linux-gnu/libmali.so.1:/usr/lib/aarch64-linux-gnu/libmali.so.1:ro # OpenCLによるHDR -> SDRトーンマッピングを有効化する場合のみ必要

  vaapi:
    devices:
      - /dev/dri:/dev/dri

  vaapi-wsl: # WSL2でImmichを実行中にVAAPIを使用する場合はこちらを使用します
    devices:
      - /dev/dri:/dev/dri
      - /dev/dxg:/dev/dxg
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl
    environment:
      - LIBVA_DRIVER_NAME=d3d12

