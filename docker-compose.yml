#
# 警告: Immichのインストール手順はガイドに従ってください: https://docs.immich.app/install/docker-compose
#
# 必ず現在のリリースの docker-compose.yml を使用してください:
#
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# mainブランチのcomposeファイルは最新リリースと互換性がない可能性があります。

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    extends:
      file: hwaccel.transcoding.yml
      service: quicksync # ハードウェアトランスコーディングを有効化する場合は [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] のいずれかを指定
    volumes:
      # 次の行は編集しないでください。システム上のメディア保存場所を変更したい場合は、.env ファイル内の UPLOAD_LOCATION の値を編集してください
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
      - tailscale
    restart: always
    healthcheck:
      disable: false

  tailscale:
    image: tailscale/tailscale:latest
    container_name: immich_server-tailscale
    hostname: immich
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--serve=80:http://immich-server:2283
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped




  immich-machine-learning:
    container_name: immich_machine_learning
    # ハードウェアアクセラレーションを使用する場合は、イメージタグに -[armnn, cuda, rocm, openvino, rknn] のいずれかを追加します。
    # タグの例: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-openvino
    extends: # ハードウェアアクセラレーションを使用する場合はこのセクションのコメントを解除します - https://docs.immich.app/features/ml-hardware-acceleration を参照
      file: hwaccel.ml.yml
      service: openvino # 推論アクセラレーションを使用する場合は [armnn, cuda, rocm, openvino, openvino-wsl, rknn] のいずれかを指定 (WSL2の場合は適宜 `-wsl` バージョンを使用)
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # データベースがSSDではなくHDDに保存されている場合は、以下の DB_STORAGE_TYPE: 'HDD' のコメントを解除してください
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      # 次の行は編集しないでください。システム上のデータベース保存場所を変更したい場合は、.env ファイル内の DB_DATA_LOCATION の値を編集してください
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:

