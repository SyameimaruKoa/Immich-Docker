name: Unclassified album
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n immich-unclassified.sh
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.unclassified.yml config --quiet
